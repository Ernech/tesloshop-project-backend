name: NestJS CI & Docker Production Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  # --- ETAPA 1: VALIDACIÓN E INTEGRACIÓN CONTINUA (CI) ---
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Caché nativa de GitHub para los node_modules locales del pipeline

      - name: Instalar dependencias puras
        run: npm ci

      - name: Verificar Linter (Estilo y Calidad)
        run: npm run lint

      - name: Ejecutar Pruebas Unitarias (Jest)
        run: npm run test

      - name: Compilar Proyecto (Validación de TypeScript)
        run: npm run build

  # --- ETAPA 2: CONSTRUCCIÓN Y PUBLICACIÓN DE ARTEFACTO (CD) ---
  build-docker-image:
    needs: validate-and-test # Solo avanza si Jest y el Build pasaron al 100%
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      # Configuración avanzada para aprovechar la caché de Docker de manera ultra rápida
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fernando Herrera - Error 2: Extraer metadatos y aplicar la estrategia de caché
      - name: Generar etiquetas para la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y subir imagen blindada a GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Mantenemos las capas cacheadas directamente en el backend de GitHub
          cache-from: type=gha
          cache-to: type=gha,mode=max
